# Charmcraft configuration for debuginfod.
# See https://juju.is/docs/sdk/charmcraft-config

name: ubuntu-debuginfod
type: charm
title: Ubuntu Debuginfod
summary: |
  A charm for deploying ubuntu-debuginfod to serve Ubuntu package's debugging symbols to gdb.
description: |
  The **ubuntu-debuginfod** operator is a [charm](https://juju.is/charms-architecture) (written using [ops](https://documentation.ubuntu.com/ops)) for deploying [ubuntu-debuginfod](https://launchpad.net/ubuntu-debuginfod), a service that provides ELF debugging symbols for Ubuntu distribution packages.
  GDB can fetch those in a debugging session, by requesting currently needed symbols from debuginfod.

platforms:
  ubuntu@26.04:amd64:

parts:
  ubuntu-debuginfod-charm:
    plugin: uv
    source: .
    build-packages:
      - git
    build-snaps:
      - astral-uv
    override-build: |
      craftctl default
      git describe --always > $CRAFT_PART_INSTALL/version

  files:
    plugin: dump
    source: .
    stage:
      - LICENSE
      - README.md
      - etc/

resources:
  ubuntu-debuginfod-deb:
    type: file
    filename: ubuntu-debuginfod.deb
    description: "optional locally built ubuntu-debuginfod binary package for testing"
  python3-ubuntu-debuginfod-deb:
    type: file
    filename: python3-ubuntu-debuginfod.deb
    description: "optional locally built python3-ubuntu-debuginfod binary package for testing"

storage:
  # where all the debug symbols are stored. ~13 TiB (at 25.04)
  debugsyms:
    description: debug symbol file storage
    type: filesystem
    #minimum-size: 20T ?
    location: /srv/debug-mirror/
    multiple:
      range: 0-1

  # debuginfod's internal sqlite database, ~400GiB (at 25.04)
  debuginfoddb:
    description: debuginfod sqlite database storage
    type: filesystem
    #minimum-size: 600G ?
    location: /var/cache/private/debuginfod/
    multiple:
      range: 0-1

  # the postgres job-database (download queue, artifacts, backfill ranges)
  debugdb:
    description: postgres job-database storage
    type: filesystem
    #minimum-size: 600G ?
    location: /srv/debug-db/
    # 0-1: allow detaching/removing the instance so it can be re-provisioned
    # from a different pool (e.g. rootfs -> cinder-nvme) without redeploying.
    multiple:
      range: 0-1

  # fast scratch space for the downloader staging and debuginfod's
  # archive extractions, e.g. a 200G cinder-nvme volume. Optional:
  # without it, staging happens on the debugsyms volume itself.
  debugtmp:
    description: fast temporary storage for downloads and archive extraction
    type: filesystem
    #minimum-size: 200G ?
    location: /srv/debug-tmp/
    multiple:
      range: 0-1

requires:
  # debuginfod gets requests via http
  # https://charmhub.io/integrations/ingress
  debuginfod-http-ingress:
    interface: ingress
    limit: 1
    optional: true

links:
  documentation: https://github.com/canonical/ubuntu-debuginfod-operator/blob/main/doc/README.md
  source: https://github.com/canonical/ubuntu-debuginfod-operator

# charm config options; Configure tab on Charmhub.
# https://juju.is/docs/sdk/charmcraft-yaml#heading--config
config:
  options:
    sync_launchpad:
      type: boolean
      description: "poll launchpad for new debug ddebs and enqueue their download"
      default: false
    download:
      type: boolean
      description: "run the downloader workers processing the download queue"
      default: true
    downloader_workers:
      type: int
      description: "number of parallel Launchpad downloader workers to run on each unit"
      default: 1
    package_source:
      type: string
      description: "install ubuntu-debuginfod from the production PPA or supplied deb resources (ppa or resource)"
      default: "ppa"
    testmode:
      type: boolean
      description: "operate in test mode (e.g. juju integration test), so we don't process the whole archive."
      default: false
    use_reverse_proxy:
      type: boolean
      description: "use nginx reverse proxy on port 80 in front of debuginfod (port 8002). When false, debuginfod is directly exposed."
      default: false
    proxy:
      type: string
      description: |
        http(s) proxy URL for the services' outbound connections (e.g. to Launchpad),
        written as a systemd drop-in for the managed units. Deployment environments
        without direct egress need this.
        Empty (default) falls back to the model's juju-http(s)-proxy settings.
        Set to "none" to force no proxy.
      default: ""
    mirror_architectures:
      type: string
      description: |
        space-separated list of architectures whose debug symbols are downloaded
        (e.g. "amd64 arm64"). empty -> all architectures.
      default: ""
    lp_credentials:
      type: secret
      description: |
        launchpad secret as the contents of a lp.cred file.
        obtain with:
          runuser -u mirror -- ubuntu-debuginfod login /tmp/lp.cred

        store it in juju (you'll get the secret_id):
          juju add-secret debuginfod-launchpad cred#file=/tmp/lp.cred

        and granted to the ubuntu-debuginfod application:
          juju grant-secret debuginfod-launchpad $application

        get the secret id:
          juju secrets

        and finally by setting this config option:
          juju config $application lp_credentials=secret:$secret_id
